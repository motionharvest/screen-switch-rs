[package]
name = "screen-switch-rs"
version = "0.1.0"
edition = "2021"
description = "Fires a per-monitor keyboard shortcut when the cursor moves to a different monitor."

[lib]
name = "screen_switch_rs"
path = "src/lib.rs"

# Background watcher (no console window).
[[bin]]
name = "screen-switch-rs"
path = "src/main.rs"

# Interactive config console (normal terminal app).
[[bin]]
name = "screen-switch-tui"
path = "src/bin/tui.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
